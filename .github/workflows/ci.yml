name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,azure]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q -s

      - name: Compile
        run: python -m compileall -q src

  terraform-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Initialize without backend
        working-directory: infra/azure/terraform
        run: terraform init -backend=false

      - name: Check format
        working-directory: infra/azure/terraform
        run: terraform fmt -check

      - name: Validate
        working-directory: infra/azure/terraform
        run: terraform validate
